services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-analytics
    # Development ports - exposed for debugging
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    restart: "unless-stopped"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles: [ "dev", "prod", "prod-only" ]

  mysql:
    image: mysql:8.0
    container_name: mysql
    # Development ports - exposed for debugging
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    restart: "unless-stopped"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles: [ "dev", "prod", "prod-only" ]

  redis:
    image: redis:7-alpine
    container_name: redis
    # Development ports - exposed for debugging
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: "unless-stopped"
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles: [ "dev", "prod", "prod-only" ]

  cosmos-ai:
    image: centras-ai.kr.ncr.ntruss.com/centras-ai/cosmos-ai:latest
    container_name: cosmos-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-analytics}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM:-"CosMos AI <noreply@adminpanel.com>"}
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "unless-stopped"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    profiles: [ "dev", "prod-only" ]

  log-monitor:
    image: node:20-alpine
    container_name: cosmos-log-monitor
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL=${TELEGRAM_CHANNEL}
      - CONTAINER_NAME=cosmos-ai
      - CLICKHOUSE_CONTAINER=clickhouse-analytics
    command: sh -c "apk add --no-cache docker-cli && node scripts/log-monitor-telegram.js"
    depends_on:
      - cosmos-ai
    restart: "unless-stopped"
    networks:
      - app-network
    profiles: [ "prod-only" ]

volumes:
  clickhouse-data:
  clickhouse-logs:
  mysql-data:
  redis-data:


networks:
  app-network:
    driver: bridge
