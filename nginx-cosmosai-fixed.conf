# ===============================================================
# CosMos AI - Nginx Configuration (FIXED - No duplicate CORS headers)
# Google Analytics-style CORS: Allow all domains (no whitelist)
# Option 1: localStorage-only, no credentials required
# ===============================================================

# Map to handle missing origin (fallback to *)
map $http_origin $cors_origin {
    default $http_origin;
    ""      "*";
}

server {
    listen 443 ssl http2;
    server_name dev.cosmosai.co.kr;

    # ----- SSL configuration -----
    ssl_certificate /etc/nginx/ssl/STAR.cosmosai.co.kr.fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/STAR.cosmosai.co.kr.key;
    ssl_trusted_certificate /etc/nginx/ssl/ca_bundle.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/dev.cosmosai.access.log;
    error_log  /var/log/nginx/dev.cosmosai.error.log;

    # ===============================================================
    # Tracking Script (serve publicly, disable caching for updates)
    # ===============================================================
    location = /cosmos-track.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow loading from any origin
        add_header 'Access-Control-Allow-Origin' '*' always;
        # Disable caching to ensure users get latest version
        add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;
        add_header 'Pragma' 'no-cache' always;
        add_header 'Expires' '0' always;
    }

    # ===============================================================
    # Tracking API (CORS: OPTIONS by nginx, POST by Next.js middleware)
    # IMPORTANT: nginx handles OPTIONS, middleware handles POST CORS headers
    # ===============================================================
    location = /api/track {
        # --- Preflight (OPTIONS) requests - handled by nginx ---
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' 0 always;
            add_header 'Content-Type' 'text/plain' always;
            return 204;
        }

        # --- Normal POST requests - Next.js middleware handles CORS ---
        # DO NOT add CORS headers here - let middleware handle it to avoid duplicates
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NO CORS headers here - middleware will add them
        
        proxy_read_timeout 90;
    }

    # ===============================================================
    # Internal Tracking API (for testing)
    # ===============================================================
    location = /api/track-internal {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' 0 always;
            add_header 'Content-Type' 'text/plain' always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NO CORS headers here - middleware will add them
        
        proxy_read_timeout 90;
    }

    # ===============================================================
    # Everything else → normal Next.js routing
    # ===============================================================
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 90;
    }
}

# ===============================================================
# HTTP → HTTPS Redirect
# ===============================================================
server {
    listen 80;
    server_name dev.cosmosai.co.kr;
    return 301 https://$host$request_uri;
}

