<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptdecor - Sign Up Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signup-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .tracking-info {
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }
        
        .tracking-info strong {
            color: #333;
        }
        
        .tracking-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }
        
        .tracking-status.active {
            background: #d4edda;
            color: #155724;
        }
        
        .tracking-status.inactive {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>🎨 Welcome to Aptdecor</h1>
        <p class="subtitle">Create your account to get started</p>
        
        <div id="messageBox"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            
            <button type="submit" id="submitBtn">
                Sign Up
            </button>
        </form>
        
        <div class="tracking-info" id="trackingInfo">
            <strong>📊 Tracking Status:</strong>
            <span class="tracking-status inactive" id="trackingStatus">Checking...</span>
            <div id="trackingDetails" style="margin-top: 10px;"></div>
        </div>
    </div>

    <!-- CosMos AI Tracking Script -->
    <!-- IMPORTANT: Replace with your actual CosMos AI domain -->
    <script src="http://localhost:3000/cosmos-track.js"></script>
    
    <script>
        // Check tracking status after script loads
        setTimeout(() => {
            const statusEl = document.getElementById('trackingStatus');
            const detailsEl = document.getElementById('trackingDetails');
            
            if (window.CosmosTracker) {
                statusEl.textContent = 'Active ✓';
                statusEl.className = 'tracking-status active';
                
                // Get UTM parameters from session
                const campaign = sessionStorage.getItem('cosmos_utm_campaign');
                const source = sessionStorage.getItem('cosmos_utm_source');
                const medium = sessionStorage.getItem('cosmos_utm_medium');
                
                if (campaign || source || medium) {
                    detailsEl.innerHTML = `
                        <small>
                            Campaign: <strong>${campaign || 'N/A'}</strong><br>
                            Source: <strong>${source || 'N/A'}</strong><br>
                            Medium: <strong>${medium || 'N/A'}</strong>
                        </small>
                    `;
                } else {
                    detailsEl.innerHTML = `
                        <small style="color: #856404;">
                            ⚠️ No UTM parameters found. Did you come via tracking link?
                        </small>
                    `;
                }
            } else {
                statusEl.textContent = 'Inactive ✗';
                statusEl.className = 'tracking-status inactive';
                detailsEl.innerHTML = `
                    <small style="color: #721c24;">
                        Tracking script not loaded
                    </small>
                `;
            }
        }, 1000);
        
        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            messageBox.innerHTML = '';
            
            // Get form data
            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                password: formData.get('password')
            };
            
            try {
                // Simulate API call (replace with your actual API endpoint)
                console.log('Sending signup request...', data);
                
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Simulate successful response
                const success = true; // In real implementation, check response.ok
                
                if (success) {
                    // ✅✅✅ TRACK CONVERSION - User successfully signed up ✅✅✅
                    if (window.CosmosTracker) {
                        const conversionResult = window.CosmosTracker.trackConversion({
                            type: 'signup',
                            value: 0
                        });
                        
                        if (conversionResult) {
                            console.log('✅ Conversion tracked successfully!');
                        }
                    } else {
                        console.warn('⚠️ CosmosTracker not available. Conversion not tracked.');
                    }
                    
                    // Show success message
                    messageBox.innerHTML = `
                        <div class="message success">
                            🎉 Account created successfully!<br>
                            <small>Conversion tracked to campaign.</small>
                        </div>
                    `;
                    
                    // Reset form
                    e.target.reset();
                    
                    // In real implementation, redirect to dashboard
                    // setTimeout(() => {
                    //     window.location.href = '/dashboard';
                    // }, 2000);
                    
                } else {
                    throw new Error('Signup failed');
                }
                
            } catch (error) {
                console.error('Signup error:', error);
                
                messageBox.innerHTML = `
                    <div class="message error">
                        ❌ Signup failed. Please try again.
                    </div>
                `;
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            }
        });
        
        // Log page load for debugging
        console.log('📄 Aptdecor signup page loaded');
        console.log('🔍 Current URL:', window.location.href);
        console.log('📊 Tracking script:', window.CosmosTracker ? 'Loaded ✓' : 'Not loaded ✗');
    </script>
</body>
</html>
